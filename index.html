<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CIEACE 2026 — Activación de la Red</title>
<style>
  :root{
    --bg-deep:    #0B1330;
    --bg-deep-2:  #122456;
    --teal:       #14B8AE;
    --blue:       #3B82F6;
    --blue-bright:#60A5FA;
    --gold:       #E9B94D;
    --gold-bright:#F4CD6B;
    --paper:      #F4F1EA;
    --paper-dim:  rgba(244,241,234,0.55);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-deep-2) 0%, var(--bg-deep) 62%, #0A0620 100%);
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--paper);
  }

  .stage{ position:relative; width:100vw; height:100vh; }

  svg.map{ position:absolute; inset:0; width:100%; height:100%; }

  /* --- landmass: more defined, real coastline shape --- */
  .landmass{
    fill: var(--blue);
    fill-opacity: 0.17;
    stroke: var(--blue);
    stroke-opacity: 0.55;
    stroke-width: 1.6;
    stroke-linejoin: round;
  }
  .island{
    fill: var(--blue);
    fill-opacity: 0.17;
    stroke: var(--blue);
    stroke-opacity: 0.5;
    stroke-width: 1.2;
    stroke-linejoin: round;
  }

  /* --- country nodes --- */
  .node{
    fill: var(--gold);
    filter: drop-shadow(0 0 6px rgba(233,185,77,0.55));
    transition: r 0.6s ease, opacity 0.6s ease, fill 0.6s ease;
  }
  .node-ring{ fill:none; stroke: var(--teal); stroke-width: 1; opacity: 0; transition: opacity 0.6s ease; }
  .idle .node{ animation: breathe 3.6s ease-in-out infinite; }
  .idle .country-node:nth-child(odd) .node{ animation-delay: -1.3s; }
  .idle .country-node:nth-child(3n) .node{ animation-delay: -2.2s; }
  @keyframes breathe{ 0%,100%{ opacity:0.5; r:5; } 50%{ opacity:1; r:7; } }

  #ring-colombia{ stroke: var(--gold); opacity: 0.65; }
  #dot-colombia{ animation: breathe-host 2.6s ease-in-out infinite; fill: var(--gold-bright); }
  @keyframes breathe-host{ 0%,100%{ opacity:0.75; r:7; } 50%{ opacity:1; r:9.5; } }

  /* --- country nodes: clickable, react on click --- */
  .country-node{ cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .country-node:focus{ outline: none; }
  .country-node .hit-area{ fill: transparent; pointer-events: all; outline: none; -webkit-tap-highlight-color: transparent; }
  .country-node .hit-area:focus{ outline: none; }
  .country-node.clicked .node{ r:8; opacity:1; animation:none; fill: var(--gold-bright); }
  .country-node.clicked .node-ring{ opacity: 0.55; }

  /* --- country name label, appears on click --- */
  .country-label{
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.03em;
    fill: var(--gold-bright);
    text-anchor: middle;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s ease;
    transform: translateY(6px);
    paint-order: stroke fill;
    stroke: rgba(11,19,48,0.9);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .country-label.visible{ opacity: 1; transform: translateY(0); }

  /* --- hub lines: drawn one by one as each country is clicked --- */
  .link{
    fill:none; stroke: var(--teal); stroke-width: 1.4; stroke-linecap: round;
    opacity: 0; stroke-dasharray: 1; stroke-dashoffset: 1; pathLength: 1;
    transition: opacity 0.2s ease;
  }
  .link.active{
    opacity: 0.9;
    animation-name: draw; animation-duration: 1.6s;
    animation-timing-function: cubic-bezier(.3,0,.2,1);
    animation-fill-mode: forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }

  /* --- reveal text --- */
  .reveal-copy{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 0.85rem; text-align:center; opacity:0; pointer-events:none; padding: 0 6vw;
  }
  .reveal .reveal-copy{ animation: fade-up 1.4s ease forwards; animation-delay: 0.3s; }
  @keyframes fade-up{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:translateY(0);} }
  .reveal-copy .mark{
    font-size: clamp(2.4rem, 5.6vw, 4.6rem);
    letter-spacing: 0.02em; color: var(--paper);
    background: rgba(20,11,46,0.6); padding: 0.1em 0.4em; border-radius: 2px;
  }
  .reveal-copy .logo-img{
    max-width: min(90vw, 720px);
    width: 70vw;
    height: auto;
    display: block;
  }
  .reveal-copy .motto{
    font-family: Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 1.9vw, 1.5rem);
    letter-spacing: 0.12em; color: var(--teal);
    background: rgba(20,11,46,0.6); padding: 0.15em 0.5em;
  }
  .reveal-copy .subtitle{
    font-family: Helvetica, Arial, sans-serif;
    font-size: clamp(0.85rem, 1.35vw, 1.15rem);
    letter-spacing: 0.02em; color: var(--gold);
    background: rgba(20,11,46,0.6); padding: 0.15em 0.6em;
    max-width: 62ch;
  }

  .reveal .map{ opacity:0.4; transition: opacity 1.2s ease; }
  .stage:not(.reveal) .map{ transition: opacity 1.2s ease; }

  .hint{
    position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    font-family: Helvetica, Arial, sans-serif; font-size: 0.85rem; letter-spacing: 0.08em;
    color: var(--paper-dim); opacity:1; transition: opacity 0.6s ease; text-align:center;
  }
  .idle .hint{ opacity:0.7; }
  .reveal .hint{ opacity:0; }
</style>
</head>

  <div class="hint" id="hintEl">Toca cada país para conectarlo con Colombia</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const hintEl = document.getElementById('hintEl');
  const countryNodes = Array.from(document.querySelectorAll('.country-node'));
  const totalCountries = countryNodes.length;
  const clicked = new Set();

  function setState(name){ stage.className = 'stage ' + name; }

  function linkFor(country){
    return document.querySelector('.link[data-country="' + country + '"]');
  }

  function activateCountry(node){
    const country = node.getAttribute('data-country');
    if (clicked.has(country)) return;
    clicked.add(country);

    node.classList.add('clicked');

    const label = node.querySelector('.country-label');
    if (label) label.classList.add('visible');

    const link = linkFor(country);
    if (link) link.classList.add('active');

    hintEl.textContent = clicked.size + ' / ' + totalCountries + ' países conectados con Colombia';

    if (clicked.size === totalCountries){
      // espera a que la última línea termine de dibujarse antes de revelar la imagen
      setTimeout(() => setState('reveal'), 1700);
    }
  }

  countryNodes.forEach((node) => {
    node.addEventListener('click', () => activateCountry(node));
    node.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        activateCountry(node);
      }
    });
    node.setAttribute('tabindex', '0');
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', 'Conectar ' + node.getAttribute('data-name') + ' con Colombia');
  });

  function reset(){
    clicked.clear();
    countryNodes.forEach((node) => {
      node.classList.remove('clicked');
      const label = node.querySelector('.country-label');
      if (label) label.classList.remove('visible');
      const link = linkFor(node.getAttribute('data-country'));
      if (link) link.classList.remove('active');
    });
    hintEl.textContent = 'Toca cada país para conectarlo con Colombia';
    setState('idle');
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R'){ reset(); }
  });
</script>
